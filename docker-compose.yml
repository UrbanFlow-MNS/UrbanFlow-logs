services:
  urbanflow-logs-db:
    image: postgres:15
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - urbanflow-logs-db:/var/lib/postgresql/data

  urbanflow-logs-service:
    build: .
    env_file:
      - .env
    ports:
      - "3000:3000"

volumes:
  urbanflow-logs-db:

